<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 520"
  role="img"
  aria-labelledby="encoding-stack-title encoding-stack-desc"
>
  <title id="encoding-stack-title">VCP Encoding Stack — Lexicon, VCP-Lang, Value Graph</title>
  <desc id="encoding-stack-desc">The three-layer VCP encoding stack. Layer A: Lexicon — structured vocabulary that names what words mean and what industrial-age defaults they replace. Layer B: VCP-Lang — declarative grammar expressing values, context, and trust in machine-readable form. Layer C: Value Graph — relational structure mapping mutual value creation across all stakeholders. Each layer depends on the one below it.</desc>

  <defs>
    <style>
      .f-sans     { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .t-head     { font-size: 20px; font-weight: 700; fill: #111827; }
      .t-deck     { font-size: 12px; fill: #6b7280; }
      .t-layer    { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
      .t-title    { font-size: 16px; font-weight: 700; }
      .t-body     { font-size: 11px; fill: #4b5563; }
      .t-badge    { font-size: 10px; font-weight: 700; }
      .t-cap      { font-size: 10px; fill: #9ca3af; }
    </style>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000014"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="8" markerHeight="8" orient="90deg">
      <path d="M 0 0 L 5 8 L 10 0 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#f9fafb"/>

  <!-- Heading -->
  <text x="400" y="44" text-anchor="middle" class="f-sans t-head">The VCP Encoding Stack</text>
  <text x="400" y="64" text-anchor="middle" class="f-sans t-deck">Three layers that together make the Value-First methodology machine-readable and AI-operational.</text>

  <!-- ─── Layer C — Value Graph (top, widest) ─── -->
  <g filter="url(#shadow-sm)">
    <!-- Card -->
    <rect x="80" y="88" width="640" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Top accent -->
    <rect x="80" y="88" width="640" height="5" rx="3" fill="#0d9488"/>
    <!-- Layer badge -->
    <rect x="100" y="104" width="64" height="20" rx="10" fill="#ccfbf1"/>
    <text x="132" y="118" text-anchor="middle" class="f-sans t-badge" fill="#0d9488">LAYER C</text>
    <!-- Primitive badges -->
    <rect x="472" y="104" width="112" height="20" rx="10" fill="#f3f4f6"/>
    <text x="528" y="118" text-anchor="middle" class="f-sans t-badge" fill="#374151">5 entity types</text>
    <rect x="592" y="104" width="112" height="20" rx="10" fill="#f3f4f6"/>
    <text x="648" y="118" text-anchor="middle" class="f-sans t-badge" fill="#374151">4 relation types</text>

    <text x="100" y="145" class="f-sans t-title" fill="#0d9488">Value Graph</text>
    <text x="260" y="145" class="f-sans t-body"> — relational structure for mutual value creation</text>
    <text x="100" y="163" class="f-sans t-body">Maps Participants, Relationships, Value Flows, Contexts, and Investments. Platform-agnostic.</text>
    <text x="100" y="179" class="f-sans t-body">AI reasoning over the Value Graph operates inside a relationship-first worldview by default. Deepest layer — shapes what AI can see.</text>
  </g>

  <!-- Down arrow C→B -->
  <line x1="400" y1="200" x2="400" y2="224" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <text x="420" y="216" class="f-sans t-cap">references</text>

  <!-- ─── Layer B — VCP-Lang ─── -->
  <g filter="url(#shadow-sm)">
    <rect x="120" y="228" width="560" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="120" y="228" width="560" height="5" rx="3" fill="#2563eb"/>
    <!-- Layer badge -->
    <rect x="140" y="244" width="64" height="20" rx="10" fill="#dbeafe"/>
    <text x="172" y="258" text-anchor="middle" class="f-sans t-badge" fill="#1d4ed8">LAYER B</text>
    <!-- Primitive badges -->
    <rect x="488" y="244" width="66" height="20" rx="10" fill="#f3f4f6"/>
    <text x="521" y="258" text-anchor="middle" class="f-sans t-badge" fill="#374151">value</text>
    <rect x="560" y="244" width="66" height="20" rx="10" fill="#f3f4f6"/>
    <text x="593" y="258" text-anchor="middle" class="f-sans t-badge" fill="#374151">context</text>
    <rect x="632" y="244" width="34" height="20" rx="10" fill="#f3f4f6"/>
    <text x="649" y="258" text-anchor="middle" class="f-sans t-badge" fill="#374151">trust</text>

    <text x="140" y="285" class="f-sans t-title" fill="#1d4ed8">VCP-Lang</text>
    <text x="262" y="285" class="f-sans t-body"> — declarative grammar for values, context, and trust</text>
    <text x="140" y="303" class="f-sans t-body">Three primitive declaration types: value (what is being created, for whom), context (operating reality),</text>
    <text x="140" y="319" class="f-sans t-body">trust (posture toward stakeholders per the TEACH framework). Declarative, not imperative. Human-authorable.</text>
  </g>

  <!-- Down arrow B→A -->
  <line x1="400" y1="340" x2="400" y2="364" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <text x="420" y="356" class="f-sans t-cap">references</text>

  <!-- ─── Layer A — Lexicon (bottom, narrowest) ─── -->
  <g filter="url(#shadow-sm)">
    <rect x="160" y="368" width="480" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="160" y="368" width="480" height="5" rx="3" fill="#ea580c"/>
    <!-- Layer badge -->
    <rect x="180" y="384" width="64" height="20" rx="10" fill="#ffedd5"/>
    <text x="212" y="398" text-anchor="middle" class="f-sans t-badge" fill="#c2410c">LAYER A</text>
    <!-- Status badge -->
    <rect x="520" y="384" width="104" height="20" rx="10" fill="#fef3c7"/>
    <text x="572" y="398" text-anchor="middle" class="f-sans t-badge" fill="#92400e">v0.1 · 6 locked terms</text>

    <text x="180" y="425" class="f-sans t-title" fill="#c2410c">Lexicon</text>
    <text x="270" y="425" class="f-sans t-body"> — structured vocabulary with contrastive pairs</text>
    <text x="180" y="443" class="f-sans t-body">Each entry names the term, defines it canonically, and pairs it against the industrial-age default it replaces.</text>
    <text x="180" y="459" class="f-sans t-body">Foundation of the stack — VCP-Lang and Value Graph both depend on Lexicon vocabulary. Open, publicly usable.</text>
  </g>

  <!-- Bottom note -->
  <text x="400" y="498" text-anchor="middle" class="f-sans t-cap">All three layers are published at v0.1 status — concept and architectural role locked, implementation in active development.</text>
</svg>
