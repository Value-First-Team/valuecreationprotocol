<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 480"
  role="img"
  aria-labelledby="protocol-stack-title protocol-stack-desc"
>
  <title id="protocol-stack-title">Protocol Stack Diagram — MCP, HCP, and VCP</title>
  <desc id="protocol-stack-desc">Three peer-level open protocols in the AI context stack: Model Context Protocol (MCP) handles model context, Human Context Protocol (HCP) handles human context, and Value Creation Protocol (VCP) handles value creation context. All three are peer-level; none is subsidiary to another.</desc>

  <!-- Definitions -->
  <defs>
    <style>
      .label-primary { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #374151; }
      .label-title   { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .label-sub     { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6b7280; }
      .label-caption { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 10px; fill: #9ca3af; }
      .label-head    { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .label-deck    { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6b7280; }
      .pill-text     { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#f9fafb" rx="0"/>

  <!-- Heading area -->
  <text x="400" y="44" text-anchor="middle" class="label-head">The Open Protocol Stack</text>
  <text x="400" y="66" text-anchor="middle" class="label-deck">Three peer-level open protocols — each addresses a distinct context layer for AI systems and human teams.</text>

  <!-- ── Connector spine (vertical) between cards ── -->
  <!-- Left connector line MCP→shared area -->
  <line x1="218" y1="260" x2="352" y2="300" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Right connector HCP→shared area -->
  <line x1="582" y1="260" x2="448" y2="300" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- VCP→shared area -->
  <line x1="400" y1="260" x2="400" y2="300" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Shared substrate bar -->
  <rect x="100" y="300" width="600" height="44" rx="8" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="400" y="316" text-anchor="middle" class="label-primary" font-weight="600" fill="#374151">AI Infrastructure Layer</text>
  <text x="400" y="334" text-anchor="middle" class="label-caption">Foundation model services, compute, data pipelines</text>

  <!-- ═════════ MCP Card ═════════ -->
  <g filter="url(#card-shadow)">
    <rect x="60" y="100" width="316" height="148" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Left accent bar -->
    <rect x="60" y="100" width="6" height="148" rx="3" fill="#2563eb"/>
    <!-- Pill -->
    <rect x="78" y="110" width="72" height="22" rx="11" fill="#dbeafe"/>
    <text x="114" y="125" text-anchor="middle" class="pill-text" fill="#1d4ed8">MCP</text>
    <!-- External link badge -->
    <text x="357" y="122" text-anchor="end" class="label-caption">modelcontextprotocol.io ↗</text>

    <text x="78" y="156" class="label-title" fill="#1d4ed8">Model Context Protocol</text>
    <text x="78" y="175" class="label-sub">Structures context passed to foundation models:</text>
    <text x="78" y="191" class="label-sub">tools, resources, sampling, and prompts.</text>
    <text x="78" y="213" class="label-sub">Created by Anthropic. Governs model-level</text>
    <text x="78" y="229" class="label-sub">context exchange between agents and hosts.</text>
  </g>

  <!-- ═════════ VCP Card (center, slightly elevated) ═════════ -->
  <g filter="url(#card-shadow)">
    <rect x="242" y="86" width="316" height="162" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <!-- Top accent bar -->
    <rect x="242" y="86" width="316" height="6" rx="3" fill="#0d9488"/>
    <!-- Pill -->
    <rect x="260" y="104" width="60" height="22" rx="11" fill="#ccfbf1"/>
    <text x="290" y="119" text-anchor="middle" class="pill-text" fill="#0d9488">VCP</text>
    <!-- "This site" indicator -->
    <rect x="462" y="104" width="82" height="20" rx="10" fill="#0d9488"/>
    <text x="503" y="118" text-anchor="middle" class="pill-text" fill="#ffffff">This Protocol</text>

    <text x="260" y="150" class="label-title" fill="#0d9488">Value Creation Protocol</text>
    <text x="260" y="169" class="label-sub">Structures the context of value creation:</text>
    <text x="260" y="185" class="label-sub">vocabulary (Lexicon), declarations (VCP-Lang),</text>
    <text x="260" y="201" class="label-sub">and relational structure (Value Graph).</text>
    <text x="260" y="222" class="label-sub">Open protocol. Maintained by the Value-First</text>
    <text x="260" y="238" class="label-sub">Collective. Implements on any CVP.</text>
  </g>

  <!-- ═════════ HCP Card ═════════ -->
  <g filter="url(#card-shadow)">
    <rect x="424" y="100" width="316" height="148" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Right accent bar -->
    <rect x="734" y="100" width="6" height="148" rx="3" fill="#ea580c"/>
    <!-- Pill -->
    <rect x="442" y="110" width="72" height="22" rx="11" fill="#ffedd5"/>
    <text x="478" y="125" text-anchor="middle" class="pill-text" fill="#c2410c">HCP</text>
    <!-- External link badge -->
    <text x="721" y="122" text-anchor="end" class="label-caption">humancontextprotocol.com ↗</text>

    <text x="442" y="156" class="label-title" fill="#c2410c">Human Context Protocol</text>
    <text x="442" y="175" class="label-sub">Structures human context for AI systems:</text>
    <text x="442" y="191" class="label-sub">values, preferences, relationships,</text>
    <text x="442" y="213" class="label-sub">and identity signals that AI should honor</text>
    <text x="442" y="229" class="label-sub">across interactions.</text>
  </g>

  <!-- ═════════ Bottom legend ═════════ -->
  <text x="400" y="380" text-anchor="middle" class="label-sub" font-weight="600">All three protocols are peer-level.</text>
  <text x="400" y="398" text-anchor="middle" class="label-caption">MCP governs model context · HCP governs human context · VCP governs value creation context</text>
  <text x="400" y="416" text-anchor="middle" class="label-caption">None is subsidiary to another. Each addresses a distinct layer of the AI operating environment.</text>

  <!-- Legend row -->
  <rect x="196" y="440" width="14" height="14" rx="2" fill="#2563eb" opacity="0.8"/>
  <text x="216" y="452" class="label-caption" fill="#374151">Model context</text>
  <rect x="310" y="440" width="14" height="14" rx="2" fill="#0d9488" opacity="0.8"/>
  <text x="330" y="452" class="label-caption" fill="#374151">Value creation context</text>
  <rect x="460" y="440" width="14" height="14" rx="2" fill="#ea580c" opacity="0.8"/>
  <text x="480" y="452" class="label-caption" fill="#374151">Human context</text>
</svg>
